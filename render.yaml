services:
  - type: web
    name: cybersage-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_playbooks.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./data/chroma
      - key: PLAYBOOKS_DIRECTORY
        value: ../knowledge_base/playbooks
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
