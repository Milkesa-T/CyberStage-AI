services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cybersage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CHROMA_PERSIST_DIRECTORY=/app/backend/data/chroma
      - PLAYBOOKS_DIRECTORY=/app/knowledge_base/playbooks
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - N8N_WEBHOOK_BEARER_TOKEN=${N8N_WEBHOOK_BEARER_TOKEN:-}
    volumes:
      - chroma-data:/app/backend/data/chroma

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: cybersage-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  chroma-data:
    driver: local
